[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "patch2proof"
version = "0.4.0"
description = "Evidence-grounded, differential, safety-preserving N-day reproduction pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research scaffold - add an institutional license before publication" }
authors = [{ name = "Patch2Proof Research Team" }]
dependencies = [
  "langgraph>=0.6.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
llm = [
  "langchain-openai>=1.0.0",
  "langchain-ollama>=0.2.0",
]
rag = [
  "qdrant-client>=1.12.0",
]
server = [
  "langgraph-cli[inmem]>=0.2.8",
]
postgres = [
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary]>=3.2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.11",
]

[project.scripts]
p2p = "patch2proof.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/patch2proof"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "patch2proof/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
